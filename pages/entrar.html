<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="../assets/css/login.css">
    <link rel="stylesheet" href="../assets/css/botaoAc.css">
    <link rel="stylesheet" href="../assets/css/modo-noturno.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link rel="icon" href="../assets/images/logo EnSintonia.jpeg" type="image/jpeg">

</head>

<body>
 
    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>

    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>

    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>

   
    <button id="btnAcessibilidade" class="btn-acessibilidade">
        <i class="fa-solid fa-universal-access"></i>
    </button>

   
    <aside id="painelAcessibilidade" class="painel-acessibilidade">

        <div class="topo-painel">
            <h3>Acessibilidade</h3>

            <button id="fecharPainel">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="item" id="abrirLibras">
            <i class="fa-solid fa-hands"></i>
            <div>
                <strong>Libras</strong>
                <p>Ativar intérprete</p>
            </div>
        </div>

        <div class="item" id="btnAltoContraste">
            <i class="fa-solid fa-circle-half-stroke"></i>
            <div>
                <strong>Alto Contraste</strong>
                <p>Melhor visualização</p>
            </div>
        </div>

        <div class="item" id="btnAumentarFonte">
            <i class="fa-solid fa-a"></i>
            <div>
                <strong>Aumentar Fonte</strong>
                <p>Texto maior</p>
            </div>
        </div>

        <div class="item" id="btnDiminuirFonte">
            <i class="fa-solid fa-a" style="font-size: 14px;"></i>
            <div>
                <strong>Diminuir Fonte</strong>
                <p>Texto menor</p>
            </div>
        </div>

        <div class="item" id="itemAtalhos">
            <i class="fa-solid fa-keyboard"></i>
            <div>
                <strong>Atalhos de Teclado</strong>
                <p>Alt + C, +, -, L</p>
            </div>
        </div>

    </aside>

    <div class="container">

        <!-- Ícone do topo -->
        <img src="../assets/icons/Entar.svg" class="icone-topo" alt="Entrar">

        <!-- Título -->
        <h1>Bem-vindo de volta!</h1>

        <!-- Subtítulo -->
        <p class="subtitulo">
            Faça login para acessar sua conta.
        </p>

        <p class="mensagem-erro" id="mensagemErro" hidden></p>

        <!-- Formulário -->
        <form id="loginForm">

            <!-- E-mail -->
            <label for="email">E-mail</label>

            <div class="campo">

                <img src="../assets/icons/Email.svg" class="icone-input" alt="Email">

                <input type="email" id="email" placeholder="Digite seu e-mail">

            </div>

            <!-- Senha -->
            <label for="senha">Senha</label>

            <div class="campo">

                <img src="../assets/icons/Lock.svg" class="icone-input" alt="Senha">

                <input type="password" id="senha" placeholder="Digite sua senha">

              
            </div>

            <!-- Política de privacidade + Esqueci a senha -->
            <div class="linha-opcoes">
                <label class="checkbox-privacidade" for="aceitarPolitica">
                    <input type="checkbox" id="aceitarPolitica">
                    <span>Aceito a <a href="./politica-privacidadede.html" target="_blank">Política de Privacidade</a></span>
                </label>

                <a href="esqueci-senha.html" class="esqueci">Esqueceu sua senha?</a>
            </div>

            <!-- Botão -->
            <button type="submit">
                Entrar
            </button>

        </form>

        <!-- Link cadastro -->
        <p class="cadastro">

            Não tem uma conta?

            <a href="../pages/cadastrar-se.html">
                Cadastre-se
            </a>

        </p>

    </div>

    <script type="module" src="../assets/js/login.js"></script>
    <script src="../assets/js/script.js"></script>

</body>

</html>
