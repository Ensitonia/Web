<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueci minha senha</title>
    <link rel="stylesheet" href="../assets/css/cadastro.css">
    <link rel="stylesheet" href="../assets/css/botaoAc.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="container">

        <h1>Esqueceu sua senha?</h1>

        <p class="subtitulo">
            Digite seu e-mail cadastrado e enviaremos um link para você redefinir sua senha.
        </p>

        <form id="formRecuperar">

            <label for="email">E-mail</label>

            <div class="campo">
                <img src="../assets/icons/Email.svg" class="icone-input" alt="Email">
                <input type="email" id="email" placeholder="Digite seu e-mail cadastrado" required>
            </div>

            <p id="mensagemRecuperar" class="aviso-questoes" role="alert" aria-live="polite" hidden></p>

            <button type="submit">
                Enviar link de redefinição
            </button>

        </form>

        <p style="text-align:center; margin-top: 16px;">
            Lembrou a senha? <a href="entrar.html">Faça login</a>
        </p>

    </div>

    <script src="../assets/js/script.js"></script>
    <script type="module" src="../assets/js/esqueci-senha.js"></script>
</body>

</html>
